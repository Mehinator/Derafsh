name: Telegram post

# Posts each published release to the Telegram channel: the text between <!-- telegram --> and <!-- /telegram -->
# in the release notes (hidden on GitHub; without it, the title), the download links, and the Android APKs as files
# (bots can send files up to 50 MB; the Windows zip is bigger, so it is a link).
# Needs the secret TELEGRAM_BOT_TOKEN: a bot (from @BotFather) that is an admin of the channel with "Post messages".
# It runs on GitHub, so it doesn't depend on reaching Telegram or uploading files from Iran.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to post, e.g. v1.10.6"
        required: true
      chat:
        description: "Where to post (default @DERAFSHVPN; a chat id for a private test)"
        required: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      CHAT: ${{ inputs.chat || '@DERAFSHVPN' }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: No bot token yet
        if: env.BOT_TOKEN == ''
        run: echo "::warning::The TELEGRAM_BOT_TOKEN secret is not set, so nothing was posted to Telegram."

      - name: Post the release to the channel
        if: env.BOT_TOKEN != ''
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,body,url,assets > release.json
          python3 - <<'PY'
          import html, json, os, re, urllib.parse, urllib.request

          r = json.load(open("release.json", encoding="utf-8"))
          m = re.search(r"<!--\s*telegram\s*-->(.*?)<!--\s*/telegram\s*-->", r["body"] or "", re.S)
          text = m.group(1).strip() if m else (r["name"] or os.environ["TAG"])

          def to_html(s):
              s = html.escape(s, quote=False)
              s = re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", s)                       # **bold**
              s = re.sub(r"`([^`]+)`", r"<code>\1</code>", s)                      # `code`
              s = re.sub(r"\[([^\]]+)\]\((https?://[^)\s]+)\)", r'<a href="\2">\1</a>', s)   # [text](url)
              return s

          labels = [("Windows-x64.zip", "ویندوز ۱۰ و ۱۱"), ("Android-arm64.apk", "اندروید (بیشتر گوشی‌ها)"),
                    ("Android-armv7.apk", "اندروید قدیمی (۳۲ بیتی)"), ("Android-universal.apk", "اندروید، اگر نمی‌دانید کدام")]
          links = [f'• <a href="{a["url"]}">{label}</a>' for end, label in labels for a in r["assets"] if a["name"].endswith(end)]
          msg = to_html(text) + "\n\n<b>دانلود</b>\n" + "\n".join(links) + f'\n\n<a href="{r["url"]}">صفحه‌ی این نسخه در گیت‌هاب</a>'
          if len(msg) > 4096:
              msg = to_html(text)[: 4096 - 200] + f'…\n\n<a href="{r["url"]}">ادامه و دانلود در گیت‌هاب</a>'

          data = urllib.parse.urlencode({"chat_id": os.environ["CHAT"], "text": msg, "parse_mode": "HTML",
                                         "disable_web_page_preview": "true"}).encode()
          res = json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage", data))
          if not res.get("ok"):
              raise SystemExit(f"Telegram refused the message: {res}")
          print("message posted")
          # the APKs that fit the bot limit, sent as files under the message
          with open("files.txt", "w") as f:
              for end, label in labels[1:3]:
                  for a in r["assets"]:
                      if a["name"].endswith(end) and a["size"] < 50 * 1000 * 1000:
                          f.write(f'{a["name"]}\t{label}\n')
          PY
          while IFS=$'\t' read -r name label; do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name" -O "$name" --clobber
            # --form-string: with -F, a value starting with @ (the channel, @DERAFSHVPN) would be read as a file name
            curl -sS --fail-with-body --form-string "chat_id=$CHAT" -F "document=@$name" --form-string "caption=$label · $TAG" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" > /dev/null
            echo "sent $name"
          done < files.txt
