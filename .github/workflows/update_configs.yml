name: Update Derafsh Configs

on:
  schedule:
    - cron: '17 */2 * * *' # پشتیبان؛ گیت‌هاب این رو فقط هر ۶ تا ۹ ساعت اجرا می‌کنه، زنجیره‌ی کار next پایین هر ۲ ساعته
  workflow_dispatch: # اجازه میده دکمه Run رو دستی هم بزنی
    inputs:
      dry_run:
        description: "فقط تست و آمار؛ لیست عوض نشه"
        type: boolean
        default: false

# دو اجرا با هم لیست رو عوض نکنن
concurrency:
  group: update-configs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    permissions:
      contents: write # اجازه میده فایل رو تغییر بده و ذخیره کنه
      actions: write # برای روشن نگه داشتن کرون (پایین رو ببین)

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up .NET (for the config tester)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # همون Xray (فورک patterniha) و همون نسخه‌ای که برنامه داره (Derafsh.Client.csproj)؛ موقع عوض کردن نسخه، هر دو جا
      - name: Get Xray for testing (SHA-256 checked)
        run: |
          curl -sSfL --retry 3 -o xray.zip "https://github.com/patterniha/Xray-core/releases/download/v26.10.22/Xray-linux-64.zip"
          echo "d32101fad9e76cc9c539ee6424d9d57d88cadbd89455bb1abf9002236cecb6ef  xray.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/xray" && unzip -q xray.zip -d "$RUNNER_TEMP/xray" && chmod +x "$RUNNER_TEMP/xray/xray" && rm xray.zip

      - name: Build the config tester
        run: dotnet publish tools/ConfigTester/ConfigTester.csproj -c Release -o "$RUNNER_TEMP/tester" --nologo -v q

      - name: Install dependencies
        run: pip install requests

      # چند اجرای پشت سر هم هر کانفیگ سالم بوده؛ توی کش گیت‌هاب، نه توی ریپو (هر ۲ ساعت عوض می‌شه)
      - name: Restore config streaks
        uses: actions/cache/restore@v5
        with:
          path: .stats/derafsh_stats.json
          key: derafsh-stats-${{ github.run_id }}
          restore-keys: derafsh-stats-

      - name: Run Collector Script
        env:
          DERAFSH_TESTER: dotnet ${{ runner.temp }}/tester/ConfigTester.dll
          DERAFSH_XRAY: ${{ runner.temp }}/xray/xray
          DERAFSH_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          DERAFSH_STATS: .stats/derafsh_stats.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # معرفی کانال با ربات (channel_submissions.py)
          BOT_API_URL: ${{ secrets.BOT_API_URL }}         # صف معرفی کانال‌ها از ربات روی Cloudflare (bot/worker.js)
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}     # گزارش‌های برنامه از داخل ایران، از D1 (iran_reports.py)
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python collector.py

      - name: Save config streaks
        if: ${{ !inputs.dry_run && hashFiles('.stats/derafsh_stats.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .stats/derafsh_stats.json
          key: derafsh-stats-${{ github.run_id }}

      - name: Commit and Push changes
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config --global user.name "Derafsh Bot"
          git config --global user.email "bot@derafsh.com"
          git add derafsh_servers.txt derafsh_sources.json derafsh_sub.txt derafsh_locations.json derafsh_channels.json derafsh_networks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto-update configs"
            # تست چند دقیقه طول می‌کشه؛ اگه این وسط چیزی روی main آمده، اول روی اون
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # برنامه فایل‌ها رو از jsDelivr می‌گیره که تا چند ساعت نسخه قدیمی رو نگه می‌داره؛ اینجا کش رو پاک می‌کنیم
      - name: Refresh jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/derafsh_servers.txt"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/derafsh_sources.json"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/derafsh_sub.txt"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/derafsh_locations.json"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/derafsh_networks.json"

      # گیت‌هاب کرون رو بعد از 60 روز بی‌فعالیتی ریپو خاموش می‌کنه؛ این مرحله هر بار دوباره روشنش نگه می‌داره
      - name: Keep workflow alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update_configs.yml/enable"

  # زنجیره‌ی هر ۲ ساعت: گیت‌هاب زمان‌بندی بالا رو زیر بار فقط هر ۶ تا ۹ ساعت اجرا می‌کنه (۲۰ نوامبر ۲۰۲۶: ۱۳:۱۹، ۲۲:۱۰،
  # ۰۳:۳۸ UTC) و کانفیگ رایگان توی چند ساعت می‌میره؛ کاربرها لیست ۹ ساعته می‌گرفتن. این کار تا ۲ ساعت بعد از شروع همین اجرا
  # صبر می‌کنه و اجرای بعدی رو خودش راه می‌اندازه (workflow_dispatch با GITHUB_TOKEN اجرای تازه می‌سازه). اگه زنجیره پاره
  # بشه، زمان‌بندی بالا دوباره راهش می‌اندازه؛ concurrency بالا نمی‌ذاره دوتا زنجیره با هم بچرخن (اجرای در صف جایگزین می‌شه).
  next:
    needs: build
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      actions: write
    steps:
      - name: Start the next run 2 hours after this one started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          wait=$(( 7200 - ( $(date +%s) - $(date -d "$started" +%s) ) ))
          echo "this run started $started; next run in $wait s"
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run update_configs.yml -R "${{ github.repository }}" --ref main
